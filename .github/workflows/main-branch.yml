name: Main Branch

on:
  push:
    branches: [main]

env:
  # puppeteer is only used by scripts/generate-pdf.ts (run locally); its Chromium
  # download during `npm ci` stalled CI until the 6h job limit.
  PUPPETEER_SKIP_DOWNLOAD: 'true'

jobs:
  prettier:
    name: Run Prettier check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Prettier
        run: npm run prettier:check

  typescript:
    name: Run TypeScript check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run TypeScript types check
        run: npm run ts:check

  astro:
    name: Run Astro check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Astro check
        run: npm run astro:check

  percy:
    name: Run Percy check
    if: github.repository == 'vishaltalreja01/portfolio'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Astro build command
        run: npm run build
        env:
          PUBLIC_APP_ENV: snapshot
      - name: Percy check
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
        run: npx percy snapshot dist/

  lighthouse:
    name: Run Lighthouse check
    if: github.repository == 'vishaltalreja01/portfolio'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v3
      # Netlify's GitHub integration deploys production; give it time to publish.
      - name: Wait for Netlify production deploy
        run: sleep 120
      - name: Lighthouse check
        uses: foo-software/lighthouse-check-action@master
        with:
          urls: https://vishal-talreja.netlify.app
          device: all

  release:
    name: Create release
    if: github.repository == 'vishaltalreja01/portfolio'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - name: Get project information
        id: projectinfo
        uses: gregoranders/nodejs-project-info@v0.0.20
      - name: Get changelog entries
        id: changelog_reader
        uses: mindsers/changelog-reader-action@v2
        with:
          version: ${{ steps.projectinfo.outputs.version }}
      - name: Create a new tag and release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.changelog_reader.outputs.version }}
          name: Release ${{ steps.changelog_reader.outputs.version }}
          body: ${{ steps.changelog_reader.outputs.changes }}
          allowUpdates: true
